# sssf.config.yaml — the factory's agent roster. One agent, one prompt, one purpose.
#
# Three coding agents, two of them subscription-billed and needing no API key:
# `claude_code` (the claude CLI on your Claude Pro/Max plan), `codex` (the codex
# CLI on your ChatGPT plan), and `pi` (API keys, any provider). This roster uses
# the first two, so a fresh install needs `claude login` + `codex login` and
# nothing in .env. See the commented pi agent at the bottom to add a third
# provider, and references/config.md for the per-interface differences.
defaults:
  coding_agent: claude_code
  model: sonnet                    # alias | full claude-* id | either with a [1m] suffix
  thinking: medium                 # off | minimal | low | medium | high | xhigh | max
                                   # (claude_code has no `off`: off/minimal -> --effort low)
  harness_engineering: []          # pi extensions (-e). PI ONLY — a claude_code agent
                                   # carrying entries here fails validate() before it spawns.
  # Roster-wide allowlist; any agent may override with its own list. The seven
  # names below are one vocabulary across both interfaces: pi passes them
  # through, claude_code maps them (find/ls -> Glob, and so on) and appends
  # TodoWrite. A name outside the seven is a pi extension tool — see the note on
  # the commented pi agent at the bottom before adding one.
  tools:
    - read                         # read file contents
    - bash                         # execute bash commands
    - edit                         # find/replace edits
    - write                        # create/overwrite files
    - grep                         # search file contents  (pi default: OFF)
    - find                         # find files by glob     (pi default: OFF)
    - ls                           # list directories       (pi default: OFF)
  # Off-limits to every agent that does not name them in its own `writes`.
  # `tools` alone cannot protect these: bash runs `git checkout`, and write
  # reaches any path. An agent must not be able to edit the machinery that
  # decides whether its own work passed. Enforced in adw_modules/permissions.ts.
  #
  # `writes:` per agent says what it may change IN THE REPO. It never restricts
  # the session runtime under data_dir — context_handoff/, envelopes, prompts,
  # raw output. Every agent can always write its own report; `writes: []` means
  # read-only with respect to the repo, not mute.
  protected_files:
    - adws/adw_modules/
    - adws/adw_sssf_config/
    - adws/adw_*.ts
    - adws/sandbox/                # guest provision/seed scripts — an in-VM agent
                                   # must not edit what provisioned its own box
  data_dir: adws/adw_data          # runtime home: {data_dir}/sessions/{adw_id}/{agent_name}/

observability:
  db: adws/adw_data/sssf.db        # tracer writes here directly; the UI polls it
  poll_ms: 500                     # visualizer live-poll cadence

# Ticket tool — `just ship ABC-123` fetches the ticket, triages it host-side,
# and drives the whole sandbox loop from it (cookbooks/sandbox.md). `tool: none`
# (the default) disables all of it. Status VALUES are per-repo: they map the
# generic ladder onto the names the ticket's LIST actually uses — the driver
# fetches the real names at runtime and degrades to a comment when one is
# missing. Secrets (CLICKUP_API_KEY, CLICKUP_TEAM_ID) live in .env, never here.
#
# project:
#   tool: clickup
#   statuses:
#     todo: backlog
#     in_progress: in development
#     in_review: in review
#     done: shipped
#     needs_info: ""               # "" = no such status on the board; comment-only

# Sandbox dispatch — `just sandbox-sdlc ABC-123 "<prompt>"` runs the whole SDLC
# inside a per-ticket exe.dev VM instead of on this machine. Every field has a
# working default; uncomment what your repo needs. Two facts to hold on to:
# exe.dev VMs are PERSISTENT AND BILL UNTIL `just sandbox-rm`, and nothing in
# the dispatch ever destroys one — teardown is always your explicit call.
# Full walk-through: cookbooks/sandbox.md.
#
# remote:
#   vm_prefix: ""                  # VM name prefix; "" = this repo's directory name.
#                                  # Ticket ABC-123 -> VM <prefix>-abc-123 -> https://<prefix>-abc-123.exe.xyz
#   tag: ""                        # REQUIRED when your exe.dev SSH key is tag-scoped —
#                                  # the key can only create VMs carrying its tag
#   cpu: 0                         # 0 / "" = provider defaults (2 cpu, 8GB, 25GB measured)
#   memory: ""                     # e.g. "8GB"
#   disk: ""                       # e.g. "20GB"
#   repo: ""                       # owner/name to clone; "" = derived from `git remote get-url origin`
#   clone_via: integration         # integration -> github.int.exe.xyz, NO token on the VM
#                                  #   (needs the repo's exe.dev GitHub integration, --readonly is enough)
#                                  # token -> github.com with GH_TOKEN from .env (contents:read PAT)
#   claude_auth: subscription      # subscription -> ship CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`),
#                                  #   runs bill your Claude plan, flat — the default
#                                  # gateway -> keyless llm.int.exe.xyz, zero credentials on the box,
#                                  #   but bills the exe.dev token allocation at API list rates
#   codex_auth: gateway            # gateway -> keyless llm.int.exe.xyz provider in the VM's
#                                  #   ~/.codex/config.toml (default; bills the exe.dev allocation)
#                                  # auth_file -> copy ~/.codex/auth.json. AVOID: OpenAI rotates
#                                  #   refresh tokens, so a shared auth.json corrupts whichever
#                                  #   side refreshes second — including your local login
#   sync_interval_s: 30            # monitor poll + trace-sync cadence
#   adws_dirs:                     # copied host -> VM when the clone has no committed factory
#     - adws
#     - justfile
#   postgres:
#     enabled: false               # true -> apt install postgres, create role+db, export DATABASE_URL
#     version: 16
#     db: app
#     user: app
#     password: app                # VM-local database; rotate nothing, it dies with the VM
#     seed_cmd: []                 # run in the clone root with DATABASE_URL set,
#                                  # e.g. ["bun", "run", "db:setup"] or ["psql", "-f", "seed.sql"]
#   env_passthrough: []            # extra host .env keys to copy into the VM's .env
#   pr:
#     enabled: false               # true -> the in-VM run pushes its branch and opens a
#                                  # draft PR through the exe.dev GitHub integration
#                                  # (must be WRITE-enabled in the exe.dev web UI)
#     base: ""                     # "" = the repo's default branch
#     draft: true
#     labels: []
#     reviewers: []                # requested when the PR is created

agents:
  - name: planner
    model: fable                   # the roster's most capable planner, and its priciest seat
    thinking: high
    color: "#a78bfa"                 # optional hex — the agent's lane color in the visualizer
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/planner/system.md
      user: adws/adw_data/prompt_engineering/planner/user.md
    writes:                        # the plan is the only thing it may leave in the repo
      - specs/
    tools:                         # full recon + write for plan.md; no edit — the planner never touches repo files
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: builder
    color: "#22d3ee"                 # no `model` key: inherits defaults.model (sonnet)
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/builder/system.md
      user: adws/adw_data/prompt_engineering/builder/user.md
    # No `writes` key: unrestricted, and the only agent that is. It still cannot
    # touch defaults.protected_files — the builder does not get to edit its own grader.
    tools:                         # the only agent that mutates the repo — everything on
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write

  - name: scout
    model: haiku                   # recon is read-and-report: the cheapest seat earns its keep
    color: "#fbbf24"
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/scout/system.md
      user: adws/adw_data/prompt_engineering/scout/user.md
    writes: []                     # read-only, and now actually read-only: its findings
                                   # go to context_handoff/, which is runtime, not the repo
    tools:                         # search-heavy recon; write only so scout_findings.md lands without a bash heredoc
      - read
      - grep
      - find
      - ls
      - bash
      - write

  # No tester agent: running the suite is a known command, so it is a kind="code"
  # phase over adw_modules/quality.ts. See SKILL.md hard rule 8.

  - name: triager
    model: haiku                   # a verdict and questions — recon-priced, judgment-shaped
    thinking: high
    color: "#f97316"
    purpose: Decide whether a ticket is implementable as written; if not, produce the questions.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/triager/system.md
      user: adws/adw_data/prompt_engineering/triager/user.md
    writes: []                     # read-only: its verdict goes to context_handoff/, not the repo
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: comment_triager
    color: "#38bdf8"                 # inherits defaults.model (sonnet)
    purpose: Classify every unresolved PR review thread into fix, reply, or clarify; draft the replies.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/comment_triager/system.md
      user: adws/adw_data/prompt_engineering/comment_triager/user.md
    writes: []                     # read-only: classifications ride the envelope
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: reviewer
    # The one agent outside the Claude family, and deliberately so: a reviewer
    # drawn from the same lineage as the builder shares its blind spots. Runs on
    # your ChatGPT subscription (`codex login`) — no API key.
    coding_agent: codex
    model: gpt-5.5                 # gpt-5.2 and other older ids are API-key only —
                                   # a ChatGPT plan 400s them AFTER the session opens
    thinking: high                 # -> model_reasoning_effort=high
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/reviewer/system.md
      user: adws/adw_data/prompt_engineering/reviewer/user.md
    writes: []                     # enforced by permissions.ts after the call, same as on
                                   # every other interface — codex's read-only sandbox would
                                   # also block the agent writing its own report, so it runs
                                   # workspace-write like the rest
    tools:                         # inert on codex — it has sandbox modes, not per-tool
      - read                       # switches. The list still documents intent, and applies
      - grep                       # verbatim if you move this agent to pi or claude_code.
      - find
      - ls
      - bash
      - write

  - name: documenter
    model: sonnet                  # deliberately NOT claude-sonnet-5[1m]: measured on a real
                                   # run, the [1m] variant bills ~1.7x per token for the SAME
                                   # 1M window sonnet already reports. Long diffs need neither.
    color: "#e879f9"
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/documenter/system.md
      user: adws/adw_data/prompt_engineering/documenter/user.md
    writes:                        # documentation only — "document only" is a rule now,
      - app_docs/                  # not a line in a prompt the model may drift from.
      - docs/                      # Markdown anywhere, because docs live next to the
      - "**/*.md"                  # code they describe as often as in a docs folder.
      - "*.md"
    tools:                         # reads the diff and the code; writes/edits documentation only
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - edit

  # A THIRD opinion, on a provider neither subscription covers. The reviewer
  # above already breaks the Claude monoculture; reach for this when you want a
  # specific model no plan includes, or a pi extension's tools (below).
  # Uncomment, install pi, set the provider's key in .env, and write the two
  # prompt files. Mixing all three interfaces in one roster is supported and
  # unremarkable: the ADW, the gates, the trace and the visualizer never learn
  # the difference.
  #
  # Two things only pi can do, and they are why this example exists:
  #   - `harness_engineering`: extension FILE PATHS, loaded as `pi -e <path>`.
  #     Claude Code rejects a non-empty list at validate() time. The installer
  #     still stamps adws/adw_data/harness_engineering/subagents.ts — it is what
  #     the four subagent_* tools below come from, and it only loads under pi.
  #   - tool names beyond the seven builtins. `--tools` filters extension tools
  #     exactly like builtins, so an extension's tool MUST be named here or it
  #     loads and is then silently filtered out.
  #
  # Enabling an extension's tools is THREE edits, not one: the file path in
  # `harness_engineering`, every tool it registers in `tools`, and a line in that
  # agent's system.md telling it when to reach for them. Miss the third and the
  # agent has a capability nobody told it about; miss it in reverse — a prompt
  # naming tools the agent lacks — and it burns turns calling something that
  # isn't there. The starter prompts carry no subagent guidance for exactly this
  # reason: the default roster is claude_code, which has no subagent_* tools.
  #
  # - name: challenger
  #   coding_agent: pi
  #   model: openai/gpt-5.6-terra  # ALWAYS provider/id — a bare id matches several providers
  #   thinking: high
  #   color: "#34d399"
  #   purpose: Review the build against the plan from outside the Claude family.
  #   prompt_engineering:
  #     system: adws/adw_data/prompt_engineering/challenger/system.md
  #     user: adws/adw_data/prompt_engineering/challenger/user.md
  #   harness_engineering:
  #     - adws/adw_data/harness_engineering/subagents.ts   # registers the four tools below
  #   writes: []                   # a reviewer that cannot fix cannot quietly fix
  #   tools:
  #     - read
  #     - grep
  #     - find
  #     - ls
  #     - bash
  #     - write
  #     - subagent_create          # extension tools MUST be named here or they are filtered out
  #     - subagent_continue
  #     - subagent_list
  #     - subagent_remove