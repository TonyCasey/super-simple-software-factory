# sssf.config.yaml — the factory's agent roster. One agent, one prompt, one purpose.
#
# Two coding agents: `claude_code` (the claude CLI on your Claude Pro/Max
# subscription — no API key) and `pi` (API keys, any provider). This starter
# roster runs entirely on `claude_code`, so a fresh install needs `claude login`
# and nothing in .env. See the commented pi agent at the bottom to mix in a
# second provider, and references/config.md for the per-interface differences.
defaults:
  coding_agent: claude_code
  model: sonnet                    # alias | full claude-* id | either with a [1m] suffix
  thinking: medium                 # off | minimal | low | medium | high | xhigh | max
                                   # (claude_code has no `off`: off/minimal -> --effort low)
  harness_engineering: []          # pi extensions (-e). PI ONLY — a claude_code agent
                                   # carrying entries here fails validate() before it spawns.
  # Roster-wide allowlist; any agent may override with its own list. The seven
  # names below are one vocabulary across both interfaces: pi passes them
  # through, claude_code maps them (find/ls -> Glob, and so on) and appends
  # TodoWrite. A name outside the seven is a pi extension tool — see the note on
  # the commented pi agent at the bottom before adding one.
  tools:
    - read                         # read file contents
    - bash                         # execute bash commands
    - edit                         # find/replace edits
    - write                        # create/overwrite files
    - grep                         # search file contents  (pi default: OFF)
    - find                         # find files by glob     (pi default: OFF)
    - ls                           # list directories       (pi default: OFF)
  # Off-limits to every agent that does not name them in its own `writes`.
  # `tools` alone cannot protect these: bash runs `git checkout`, and write
  # reaches any path. An agent must not be able to edit the machinery that
  # decides whether its own work passed. Enforced in adw_modules/permissions.ts.
  #
  # `writes:` per agent says what it may change IN THE REPO. It never restricts
  # the session runtime under data_dir — context_handoff/, envelopes, prompts,
  # raw output. Every agent can always write its own report; `writes: []` means
  # read-only with respect to the repo, not mute.
  protected_files:
    - adws/adw_modules/
    - adws/adw_sssf_config/
    - adws/adw_*.ts
  data_dir: adws/adw_data          # runtime home: {data_dir}/sessions/{adw_id}/{agent_name}/

observability:
  db: adws/adw_data/sssf.db        # tracer writes here directly; the UI polls it
  poll_ms: 500                     # visualizer live-poll cadence

agents:
  - name: planner
    model: fable                   # the roster's most capable planner, and its priciest seat
    thinking: high
    color: "#a78bfa"                 # optional hex — the agent's lane color in the visualizer
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/planner/system.md
      user: adws/adw_data/prompt_engineering/planner/user.md
    writes:                        # the plan is the only thing it may leave in the repo
      - specs/
    tools:                         # full recon + write for plan.md; no edit — the planner never touches repo files
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: builder
    color: "#22d3ee"                 # no `model` key: inherits defaults.model (sonnet)
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/builder/system.md
      user: adws/adw_data/prompt_engineering/builder/user.md
    # No `writes` key: unrestricted, and the only agent that is. It still cannot
    # touch defaults.protected_files — the builder does not get to edit its own grader.
    tools:                         # the only agent that mutates the repo — everything on
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write

  - name: scout
    model: haiku                   # recon is read-and-report: the cheapest seat earns its keep
    color: "#fbbf24"
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/scout/system.md
      user: adws/adw_data/prompt_engineering/scout/user.md
    writes: []                     # read-only, and now actually read-only: its findings
                                   # go to context_handoff/, which is runtime, not the repo
    tools:                         # search-heavy recon; write only so scout_findings.md lands without a bash heredoc
      - read
      - grep
      - find
      - ls
      - bash
      - write

  # No tester agent: running the suite is a known command, so it is a kind="code"
  # phase over adw_modules/quality.ts. See SKILL.md hard rule 8.

  - name: reviewer
    model: opus
    thinking: high
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/reviewer/system.md
      user: adws/adw_data/prompt_engineering/reviewer/user.md
    writes: []                     # a reviewer that cannot fix cannot quietly fix — the
                                   # claim the tool list only implied, now enforced
    tools:                         # full read surface; write only for review.md, no edit
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: documenter
    model: sonnet                  # deliberately NOT claude-sonnet-5[1m]: measured on a real
                                   # run, the [1m] variant bills ~1.7x per token for the SAME
                                   # 1M window sonnet already reports. Long diffs need neither.
    color: "#e879f9"
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/documenter/system.md
      user: adws/adw_data/prompt_engineering/documenter/user.md
    writes:                        # documentation only — "document only" is a rule now,
      - app_docs/                  # not a line in a prompt the model may drift from.
      - docs/                      # Markdown anywhere, because docs live next to the
      - "**/*.md"                  # code they describe as often as in a docs folder.
      - "*.md"
    tools:                         # reads the diff and the code; writes/edits documentation only
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - edit

  # A second opinion from outside the Claude family — the one thing this roster
  # cannot give you, since every agent above shares a provider and a house style.
  # Uncomment, install pi, set the provider's key in .env, and write the two
  # prompt files. Mixing interfaces in one roster is supported and unremarkable:
  # the ADW, the gates, the trace and the visualizer never learn the difference.
  #
  # Two things only pi can do, and they are why this example exists:
  #   - `harness_engineering`: extension FILE PATHS, loaded as `pi -e <path>`.
  #     Claude Code rejects a non-empty list at validate() time. The installer
  #     still stamps adws/adw_data/harness_engineering/subagents.ts — it is what
  #     the four subagent_* tools below come from, and it only loads under pi.
  #   - tool names beyond the seven builtins. `--tools` filters extension tools
  #     exactly like builtins, so an extension's tool MUST be named here or it
  #     loads and is then silently filtered out.
  #
  # - name: challenger
  #   coding_agent: pi
  #   model: openai/gpt-5.6-terra  # ALWAYS provider/id — a bare id matches several providers
  #   thinking: high
  #   color: "#34d399"
  #   purpose: Review the build against the plan from outside the Claude family.
  #   prompt_engineering:
  #     system: adws/adw_data/prompt_engineering/challenger/system.md
  #     user: adws/adw_data/prompt_engineering/challenger/user.md
  #   harness_engineering:
  #     - adws/adw_data/harness_engineering/subagents.ts   # registers the four tools below
  #   writes: []                   # a reviewer that cannot fix cannot quietly fix
  #   tools:
  #     - read
  #     - grep
  #     - find
  #     - ls
  #     - bash
  #     - write
  #     - subagent_create          # extension tools MUST be named here or they are filtered out
  #     - subagent_continue
  #     - subagent_list
  #     - subagent_remove
